[project]
name = "pcm-analyzer"
version = "1.0.0"
description = "PCM / WAV multi-channel playback and analysis tool for macOS"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "soundfile>=0.12.1",
    "sounddevice>=0.4.6",
    "PySide6>=6.6",
]

[project.scripts]
pcm-analyzer = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
